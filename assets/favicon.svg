<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f2fe" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Background circular space -->
  <circle cx="50" cy="50" r="46" fill="#060913" stroke="url(#glow)" stroke-width="4" />
  
  <!-- Coding symbol < > representing high-tech engineering -->
  <path d="M 38 34 L 24 50 L 38 66" fill="none" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  <path d="M 62 34 L 76 50 L 62 66" fill="none" stroke="#7f00ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing central active dot -->
  <circle cx="50" cy="50" r="6" fill="#00f2fe" filter="url(#shadow)" />
</svg>
